name: Deploy Roblox Place

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - production
          - development
          - qa

      qaAction:
        description: "QA environment action"
        required: false
        type: choice
        options:
          - create new place
          - publish to existing place

      placeId:
        description: "Place ID (required if overriding/removing in QA)"
        required: false

      projectFileName:
        description: "Project file name"
        required: false

      version:
        description: "Branch/tag/ref to deploy"
        type: environment
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.version }}

      - uses: ok-nick/setup-aftman@v0.3.0
        name: Install aftman
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: List mapped directories
        run: |
          ls -la Packages
          ls -la environment-configs/client/Packages
          ls -la environment-configs/server/Packages
          find Packages -maxdepth 3 -type f | sed -n '1,200p'

      - name: Ensure Packages folders exist
        run: |
          mkdir -p Packages
          mkdir -p environment-configs/client/Packages
          mkdir -p environment-configs/server/Packages

      - name: Install Wally (root)
        run: wally install

      - name: Install Wally (client-only env)
        run: cd environment-configs/client && wally install

      - name: Install Wally (server-only env)
        run: cd environment-configs/server && wally install

      - name: Build place with Rojo
        run: rojo build default.project.json -o game.rbxl

      - name: Deploy to production
        if: ${{ github.event.inputs.environment == 'production' }}
        run: |
          rbxcloud experience publish \
            -f game.rbxl \
            -i ${{ vars.PLACE_ID }} \
            -u ${{ vars.UNIVERSE_ID }} \
            -t published \
            -a ${{ secrets.API_KEY }}

      - name: Deploy to development site
        if: ${{ github.event.inputs.environment == 'development' }}
        run: |
          rbxcloud experience publish \
            -f game.rbxl \
            -i ${{ vars.PLACE_ID }} \
            -u ${{ vars.UNIVERSE_ID }} \
            -t published \
            -a ${{ secrets.API_KEY }}

      - name: (QA) Create new place
        if: ${{ github.event.inputs.environment == 'qa' && github.event.inputs.qaAction == 'create new place' }}
        run: |
          rbxcloud place create \
            -u ${{ vars.UNIVERSE_ID }} \
            -f game.rbxl \
            -a ${{ secrets.API_KEY }}

      - name: (QA) Override existing place
        if: ${{ github.event.inputs.environment == 'qa' && github.event.inputs.qaAction == 'override existing place' }}
        run: |
          rbxcloud experience publish \
            -f game.rbxl \
            -i ${{ github.event.inputs.placeId }} \
            -u ${{ vars.UNIVERSE_ID }} \
            -t published \
            -a ${{ secrets.API_KEY }}

      - name: (QA) Delete place
        if: ${{ github.event.inputs.environment == 'qa' && github.event.inputs.qaAction == 'remove place' }}
        run: |
          rbxcloud place delete \
            -i ${{ github.event.inputs.placeId }} \
            -u ${{ vars.UNIVERSE_ID }} \
            -a ${{ secrets.API_KEY }}
